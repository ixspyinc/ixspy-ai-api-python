# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run unit tests before publishing
        run: python -m pytest -q

      - name: Build release distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify version metadata is not a placeholder
        run: |
          python - <<'PY'
          import glob
          import os
          from ixspy_ai_api.version import normalize_version
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "未生成 wheel"
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = [n for n in archive.namelist() if n.endswith("METADATA")][0]
              content = archive.read(metadata_name).decode()
          version_line = [line for line in content.splitlines() if line.startswith("Version:")][0]
          version = version_line.split(":", 1)[1].strip()
          print(f"wheel 版本: {version}")
          assert version == normalize_version(os.environ["GITHUB_REF"]), "版本与发布标签不一致"
          assert version and version != "0.0.0", f"版本号无效: {version!r}"
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/p/ixspy-ai-api
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/ixspy-ai-api/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
